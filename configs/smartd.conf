# /etc/smartd.conf - Configured for Proxmox VE Hardware Monitoring

# NVMe OS Drive (WD Blue SN580 250GB)
/dev/nvme0n1 -d nvme -a -o on -S on -W 4,65,75 -m @<nomailer> -M exec /usr/local/bin/smartd-discord.sh -s (S/../.././02|L/../(01|15)/./03)

# SATA ZFS HDDs (Seagate 2TB x 4)
# -R 5: Monitor Raw value of Reallocated_Sector_Ct (Bad Sector)
# -C 197+: Monitor Current Pending Sectors increases
# -U 198+: Monitor Offline Uncorrectable Sectors increases
# -W 4,45,55: Temp difference 4C, informal warn 45C, critical 55C
/dev/sda -d sat -a -o on -S on -R 5 -C 197+ -U 198+ -W 4,45,55 -m @<nomailer> -M exec /usr/local/bin/smartd-discord.sh -s (S/../.././02|L/../(01|15)/./03)
/dev/sdb -d sat -a -o on -S on -R 5 -C 197+ -U 198+ -W 4,45,55 -m @<nomailer> -M exec /usr/local/bin/smartd-discord.sh -s (S/../.././02|L/../(01|15)/./03)
/dev/sdc -d sat -a -o on -S on -R 5 -C 197+ -U 198+ -W 4,45,55 -m @<nomailer> -M exec /usr/local/bin/smartd-discord.sh -s (S/../.././02|L/../(01|15)/./03)
/dev/sdd -d sat -a -o on -S on -R 5 -C 197+ -U 198+ -W 4,45,55 -m @<nomailer> -M exec /usr/local/bin/smartd-discord.sh -s (S/../.././02|L/../(01|15)/./03)