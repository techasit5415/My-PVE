# /etc/sanoid/sanoid.conf
# ZFS Auto-Snapshot Configuration for Proxmox VE Pool "data"

[data]
    use_template = production
    recursive = yes

#############################
# Templates
#############################

[template_production]
    frequently = 0
    hourly = 24
    daily = 30
    monthly = 3
    yearly = 0
    autosnap = yes
    autoprune = yes