[Definition]
actionstart =
actionstop =
actioncheck =
actionban = /usr/local/bin/discord-send.sh \
    --title "🚫 Fail2ban: แบน IP ต้องสงสัย (<ip>)" \
    --desc "**ระบบความปลอดภัย:** ตรวจพบการพยายามสุ่มรหัสผ่านหรือ Brute-force บนเซิร์ฟเวอร์" \
    --color red \
    --field "Banned IP|<ip>|true" \
    --field "Jail|<name>|true" \
    --field "Attempts|<failures> ครั้ง|true" \
    --field "Ban Duration|24 ชั่วโมง|true" \
    --field "Host|$(hostname)|true"

actionunban = /usr/local/bin/discord-send.sh \
    --title "🔓 Fail2ban: ปลดแบน IP (<ip>)" \
    --desc "**ระบบความปลอดภัย:** ปลดแบน IP อัตโนมัติเนื่องจากครบกำหนดระยะเวลา" \
    --color blue \
    --field "Unbanned IP|<ip>|true" \
    --field "Jail|<name>|true" \
    --field "Host|$(hostname)|true"